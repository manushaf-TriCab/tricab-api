name: API checks

# Reusable: called by deploy-production.yml and pull-request-checks.yml so the
# merge gate and the deploy gate cannot drift apart.
on:
  workflow_call:
    secrets:
      DOCGEN_DEPLOY_KEY:
        description: Read-only deploy key for the private tricab/docgen Composer package
        required: true
      CABLEGEN_DEPLOY_KEY:
        description: Read-only deploy key for the private tricab/cablegen Composer package
        required: true

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out API
        uses: actions/checkout@v5
        with:
          path: tricab-api

      # PHPStan validates source/configuration changes before reusing results.
      # Always execute the quality gate; this caches analysis, not a pass/fail flag.
      - name: Restore PHPStan result cache
        uses: actions/cache@v4
        with:
          path: tricab-api/var/cache/phpstan
          key: phpstan-${{ runner.os }}-php85-${{ hashFiles('tricab-api/composer.lock', 'tricab-api/phpstan*.neon') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: phpstan-${{ runner.os }}-php85-${{ hashFiles('tricab-api/composer.lock', 'tricab-api/phpstan*.neon') }}-

      - name: Set up API
        uses: ./tricab-api/.github/actions/setup-api
        with:
          docgen-deploy-key: ${{ secrets.DOCGEN_DEPLOY_KEY }}
          cablegen-deploy-key: ${{ secrets.CABLEGEN_DEPLOY_KEY }}

      - name: Run PHPStan
        working-directory: tricab-api
        run: composer analyse

  phpunit-pytest:
    name: PHPUnit and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out API
        uses: actions/checkout@v5
        with:
          path: tricab-api

      - name: Set up API
        uses: ./tricab-api/.github/actions/setup-api
        with:
          docgen-deploy-key: ${{ secrets.DOCGEN_DEPLOY_KEY }}
          cablegen-deploy-key: ${{ secrets.CABLEGEN_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tricab-api/core/python/requirements.txt
            tricab-api/core/python/requirements-dev.txt

      - name: Install Python test dependencies
        working-directory: tricab-api
        run: python -m pip install --requirement core/python/requirements-dev.txt

      - name: Run PHPUnit
        working-directory: tricab-api
        run: composer test

      - name: Run pytest
        working-directory: tricab-api
        env:
          # The release builder deliberately rejects test caches in core/python.
          PYTEST_ADDOPTS: -p no:cacheprovider
        run: composer python-test
