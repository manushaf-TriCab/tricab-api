name: Frontend checks

# Reusable: called by deploy-production.yml and pull-request-checks.yml.
on:
  workflow_call:
    inputs:
      website_sha:
        description: Website commit to test
        type: string
        required: true
    secrets:
      TRICAB_WEB_READ_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  frontend-tests:
    # Keep the /6 here and in the --shard argument below in step.
    # vitest splits files by path hash, not by duration; six shards cut the
    # slowest shard from ~74 to ~50 file-seconds (eight gain nothing more:
    # the two slowest files are 22 s and 18 s).
    name: Frontend tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out website
        uses: actions/checkout@v5
        with:
          repository: tricab/tricab-website-v2
          ref: ${{ inputs.website_sha }}
          token: ${{ secrets.TRICAB_WEB_READ_TOKEN }}
          path: tricab-web

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tricab-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: tricab-web
        run: npm ci

      - name: Run frontend application test shard
        working-directory: tricab-web
        run: npm test -- src --shard=${{ matrix.shard }}/6
