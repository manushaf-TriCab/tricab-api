name: Set up API
description: Install PHP and Composer dependencies for tricab-api. Check out the repository into ./tricab-api first.

runs:
  using: composite
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: pdo_sqlsrv, sqlsrv
        coverage: none
        tools: composer:v2

    - name: Locate Composer download cache
      id: composer-cache
      shell: bash
      working-directory: tricab-api
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-php83-${{ hashFiles('tricab-api/composer.lock') }}
        restore-keys: composer-${{ runner.os }}-php83-

    - name: Install API dependencies
      shell: bash
      working-directory: tricab-api
      run: composer install --prefer-dist --no-interaction --no-progress
