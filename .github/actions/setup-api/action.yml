name: Set up API
description: Install PHP and Composer dependencies for tricab-api. Check out the repository into ./tricab-api first.

inputs:
  docgen-deploy-key:
    description: The read-only deploy key for the private tricab/docgen repository (the DOCGEN_DEPLOY_KEY secret)
    required: true

runs:
  using: composite
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: pdo_sqlsrv, sqlsrv
        coverage: none
        tools: composer:v2

    - name: Load the docgen deploy key
      uses: ./tricab-api/.github/actions/docgen-ssh
      with:
        deploy-key: ${{ inputs.docgen-deploy-key }}

    - name: Locate Composer download cache
      id: composer-cache
      shell: bash
      working-directory: tricab-api
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-php85-${{ hashFiles('tricab-api/composer.lock') }}
        restore-keys: composer-${{ runner.os }}-php85-

    - name: Install API dependencies
      shell: bash
      working-directory: tricab-api
      # No --prefer-dist: it would override the per-package `source` preference for docgen.
      run: composer install --no-interaction --no-progress
