name: Docgen deploy key
description: >-
  Let Composer install the private tricab/docgen package over SSH with its read-only
  deploy key (the DOCGEN_DEPLOY_KEY secret). A deploy key belongs to the repository,
  not a person, never expires and needs no org approval. Composer then clones docgen
  from git (its lock source URL is git@github.com:tricab/docgen.git); every other
  package still installs from dist.

inputs:
  deploy-key:
    description: The private half of the tricab/docgen deploy key (the DOCGEN_DEPLOY_KEY secret)
    required: true

runs:
  using: composite
  steps:
    - name: Load the docgen deploy key
      shell: bash
      env:
        DOCGEN_DEPLOY_KEY: ${{ inputs.deploy-key }}
        # Authenticated: anonymous api.github.com calls share a 60/hour limit per runner IP and got 403s.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [ -z "$DOCGEN_DEPLOY_KEY" ]; then
          echo "The DOCGEN_DEPLOY_KEY secret is not set; Composer cannot install the private tricab/docgen package." >&2
          exit 1
        fi
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$DOCGEN_DEPLOY_KEY" > ~/.ssh/docgen_deploy_key
        chmod 600 ~/.ssh/docgen_deploy_key
        # GitHub's published host keys, so the first connection is verified rather than trusted blindly.
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
        cat >> ~/.ssh/config <<'EOF'
        Host github.com
          IdentityFile ~/.ssh/docgen_deploy_key
          IdentitiesOnly yes
        EOF
        # Clone docgen over SSH from its source; the dist zipball needs an API token we don't have.
        composer config --global preferred-install.tricab/docgen source
        composer config --global github-protocols ssh
