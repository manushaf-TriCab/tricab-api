# Response compression for the API (JSON) and the SPA's static text assets.
#
# NOT ACTIVE: `default` does not include this file yet. To enable, add
#     include /home/site/wwwroot/nginx-compression.conf;
# inside the `server { ... }` block of `default` (see docs/deployment/response-compression.md).
#
# - text/event-stream is deliberately absent, and @tricab_api_stream already sets `gzip off`,
#   so streamed assistant replies are never buffered for compression.
# - nginx turns a strong ETag into a weak one (W/"...") when it compresses. The API's
#   If-None-Match check (PayloadEtag) accepts the weak form, so 304s keep working.
# - gzip_proxied any: requests reach nginx through the App Service front end; without it
#   nginx skips compression for requests that carry a Via header.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/problem+json
    application/javascript
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

# Brotli needs the ngx_brotli dynamic module, which stock nginx builds (including the App Service
# PHP image) do not ship. Only if `nginx -V 2>&1 | grep -q brotli` succeeds on the instance:
#
# brotli on;
# brotli_comp_level 5;
# brotli_min_length 1024;
# brotli_types application/json application/problem+json application/javascript
#              application/manifest+json application/xml image/svg+xml text/css text/plain text/xml;
